<!DOCTYPE html>
<html>
    <head>

        <script id="vertex-shader" type="x-shader/x-vertex">
            attribute vec4 vPosition;
            
            void
            main(){
                gl_Position = vPosition;
            }
        </script>
        <script id="fragment-shader" type="x-shader/x-fragment">
            precision mediump float;
            uniform vec4 uColor;
            void
            main(){
                gl_FragColor = uColor;
            }
        </script>
        <script type="text/javascript" src="../common/MV.js"></script>
        <script type="text/javascript" src="../common/initShader.js"></script>
        <script type="text/javascript" src="../common/webgl-utils.js"></script>
        <script type="text/javascript" src="./Sirepinski_Carpet.js"></script>
    </head>
    <body>
        <button id="changeColor">랜덤 색상 변경</button>
        <label for="reps">reps</label>
        <input type="number" id="reps" min="1" max="10" value="3">
        <button id="applyReps">적용</button>
        <canvas id="gl-canvas" width="512" height="512">rendering failed</canvas>
    </body>
    
</html>
